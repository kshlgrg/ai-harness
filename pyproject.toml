[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "FORGE: Self-Verifying AI Software Engineer Harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FORGE Team", email = "hackathon@example.com"}
]
dependencies = [
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
